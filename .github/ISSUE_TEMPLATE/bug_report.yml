name: Bug Report
description: Report a bug in Forge CLI
labels: ["bug"]
body:
  - type: input
    id: forge-version
    attributes:
      label: Forge CLI Version
      description: Output of `forge --version`
      placeholder: "forge, version 0.1.0a0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "Ubuntu 22.04 / macOS 14 / Windows 11"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact commands and their output.
      placeholder: |
        1. Run `forge create ...`
        2. See error: ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

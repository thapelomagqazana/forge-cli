# A boolean variable whose default is non-trivial. Also exercises the
# conditional-files path when the variable is used in a condition.
schema_version: "1.0.0"
id: python.boolean
name: Boolean Variable
version: 2.0.0
description: A blueprint that toggles an optional feature.
category: automation
variables:
  - id: include_tests
    type: boolean
    description: Whether to scaffold a test suite.
    required: false
    default: true
verification:
  - id: exists
    type: required_file
    path: pyproject.toml
files:
  - source: templates/pyproject.toml.j2
    destination: pyproject.toml
conditional_files:
  - condition: "include_tests == true"
    files:
      - source: templates/test_placeholder.py.j2
        destination: tests/test_placeholder.py
compatibility:
  min_forge_version: 1.0.0

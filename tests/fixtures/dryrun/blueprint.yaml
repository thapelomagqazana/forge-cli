schema_version: "1.0.0"
id: sample.dryrun
name: Dry Run Demo
version: 1.0.0
description: >
  A minimal three-file blueprint used by the dry-run test suite. One
  static file, one conditional file (gated on `include_docker`), and
  one second conditional file to prove skip-list completeness.
category: api
maintainer: "@forge-team"
compatibility:
  min_forge_version: 1.0.0
variables:
  - id: include_docker
    type: boolean
    description: Include a Dockerfile in the generated project.
    required: false
    default: false
files:
  - source: templates/main.py.j2
    destination: src/main.py
  - source: templates/pyproject.toml.j2
    destination: pyproject.toml
conditional_files:
  - condition: include_docker == true
    files:
      - source: templates/Dockerfile.j2
        destination: Dockerfile
verification:
  - id: has_pyproject
    type: required_file
    path: pyproject.toml

id: sample.empty
name: Empty Blueprint
version: 1.0.0
description: >
  A blueprint with no files. Used to prove the dry-run renders an
  empty plan with the same envelope shape as a non-empty plan — a
  property automation depends on when enumerating plans across many
  blueprints.

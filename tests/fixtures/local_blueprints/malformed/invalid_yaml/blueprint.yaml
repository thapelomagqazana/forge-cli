# malformed/invalid_yaml
#
# A manifest that cannot be parsed by yaml.safe_load. The exact syntax
# error (a mapping key followed by another mapping key on the same
# line, without quotes) is a common hand-editing mistake that the
# YAML grammar rejects. The resolver must catch this via
# yaml.YAMLError and wrap it in MalformedBlueprintError.


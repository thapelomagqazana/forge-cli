# valid/custom.full
#
# Exercises every schema construct the v1.0.0 schema allows:
# - all three variable types (string, boolean, enum)
# - static files
# - conditional files
# - a verification contract mixing required_file and command checks
# - optional maintainer field
#
# Tests that need a blueprint with variables (for the wizard, for
# per-variable validation, for parity) copy this directory. The
# matching template file under templates/ is referenced by files[],
# so a test that exercises scaffolding can use this fixture end-to-end.

schema_version: "1.0.0"
id: custom.full
name: Full Custom Blueprint
version: 1.2.3
description: A local blueprint that exercises every schema construct. Used as the "complex fixture" by discovery, wizard, and scaffolding tests.
category: automation
maintainer: "@test-team"
compatibility:
  min_forge_version: 1.0.0

variables:
  - id: author
    type: string
    description: Author name written into the generated README.
    required: true
    default: test-author
    validation:
      pattern: "^[A-Za-z0-9][A-Za-z0-9 ._-]*$"

  - id: log_level
    type: enum
    description: Logging verbosity for the generated script.
    required: true
    default: info
    validation:
      enum:
        - debug
        - info
        - warning

  - id: include_tests
    type: boolean
    description: Whether to scaffold a pytest harness.
    required: false
    default: true

files:
  - source: templates/README.md.j2
    destination: README.md

conditional_files:
  - condition: include_tests == true
    files:
      - source: templates/README.md.j2
        destination: tests/README.md

verification:
  - id: has_readme
    type: required_file
    path: README.md

  - id: readme_not_empty
    type: command
    command: test -s README.md
    timeout: 30

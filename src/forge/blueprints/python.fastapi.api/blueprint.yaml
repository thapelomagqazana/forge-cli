# ---------------------------------------------------------------------------
# Forge official blueprint — python.fastapi.api
#
# Scaffolds a minimal, production-shaped FastAPI service:
#   * src-layout package with a health endpoint
#   * typed settings via pydantic-settings
#   * pytest + httpx test scaffolding
#   * optional Dockerfile + compose file
#
# This file is validated at load time against
#   src/forge/schemas/blueprint.schema.json  (schema, canonical)
#   src/forge/models/blueprint.py             (typed projection)
# so any field-shape mistake fails CI rather than surprising users.
# ---------------------------------------------------------------------------
schema_version: "1.0.0"

# Dotted, lowercase identifier. This is the string users type after
# `forge create`. Stable forever — bumping it is a breaking change.
id: python.fastapi.api

name: Python FastAPI API
version: 1.0.0
description: >-
  A production-shaped FastAPI service with a typed settings module, a
  health endpoint, pytest + httpx test scaffolding, and optional Docker
  support. Generated code favours clarity over cleverness so new team
  members can read it on day one.

category: api
maintainer: "@platform-team"

# ---------------------------------------------------------------------------
# Compatibility — the minimum CLI version that understands this document.
# Consumers older than this must refuse to load the blueprint rather than
# silently mis-scaffold.
# ---------------------------------------------------------------------------
compatibility:
  min_forge_version: 1.0.0

# ---------------------------------------------------------------------------
# Variables — presented in this order by the interactive wizard.
# Ids are lower_snake_case (schema-enforced) because they are used
# verbatim in templates as `{{variable_id}}`.
#
# The variable `project_name` is supplied by the CLI itself (it is the
# `--name` argument folded into the template context — see
# cli/commands/create.py's `_resolve_inputs`), so it is *not* declared
# here. Declaring it would make the resolver try to resolve it against
# `--var`, which is not how the CLI supplies it, and the result would be
# a confusing "you must also pass --var project_name=..." prompt. The
# CLI's contract is that `project_name` is always available.
#
# The *derived* value `project_module` — the Python identifier derived
# from `project_name` — is also not declared. It is computed inline via
# the `replace('-', '_')` filter wherever a Python module path is needed
# (destinations, verification `path:`, verification `command:`). The
# filter is in the renderer's allowlist (docs/reference/TEMPLATE_FILTERS.md)
# precisely for this case.
# ---------------------------------------------------------------------------
variables:
  - id: author
    type: string
    description: Author name written to LICENSE and pyproject.toml metadata.
    required: true
    default: forge
    validation:
      # Rejects empty strings and path-unsafe characters early, so the
      # wizard can show the error while the user is still typing.
      pattern: "^[A-Za-z0-9][A-Za-z0-9 ._-]*$"

  - id: python_version
    type: enum
    description: Target Python version for pyproject classifiers and ruff config.
    required: true
    default: "3.12"
    validation:
      enum:
        - "3.11"
        - "3.12"
        - "3.13"

  - id: include_docker
    type: boolean
    description: Include a Dockerfile, .dockerignore, and compose.yaml.
    required: false
    default: true

# ---------------------------------------------------------------------------
# Files — always applied.
#
# Contract (see docs/reference/PLANNING.md):
#   * `source:` is a *literal* path resolved against the blueprint
#     directory. It is not templated; the loader verifies its existence
#     before planning succeeds (loading/fs_checks.py). A template that
#     will be rendered must end in `.j2` (or `.jinja`/`.jinja2`) and live
#     at a static path; a template that is copied verbatim must have no
#     suffix and must not contain `{{…}}`.
#   * `destination:` *is* templated. Every segment that ends up as a
#     Python package name must be a valid Python identifier, so
#     `project_name` is transformed with `replace('-', '_')` wherever
#     the destination is a module path.
#
# The template's `source:` directory is `templates/src/project/` — a
# static `project` segment, not `{{project_name}}/` — because `source:`
# is not templated. The `.j2` suffix on each file marks it as render-kind
# (its body contains `{{…}}` and must be rendered); the absence of the
# suffix on `.gitignore` marks it as copy-kind (its body must not contain
# `{{…}}` and must be preserved byte-for-byte).
# ---------------------------------------------------------------------------
files:
  - source: templates/pyproject.toml.j2
    destination: pyproject.toml
  - source: templates/README.md.j2
    destination: README.md
  - source: templates/.gitignore
    destination: .gitignore
  - source: templates/src/project/__init__.py
    destination: src/{{project_name | replace('-', '_')}}/__init__.py
  - source: templates/src/project/main.py.j2
    destination: src/{{project_name | replace('-', '_')}}/main.py
  - source: templates/src/project/settings.py.j2
    destination: src/{{project_name | replace('-', '_')}}/settings.py
  - source: templates/tests/test_health.py.j2
    destination: tests/test_health.py
  - source: templates/tests/conftest.py.j2
    destination: tests/conftest.py

# ---------------------------------------------------------------------------
# Conditional files — applied only when the expression evaluates true.
# Expressions are intentionally simple (`<var_id> == <literal>`); anything
# more complex belongs in a dedicated blueprint.
# ---------------------------------------------------------------------------
conditional_files:
  - condition: include_docker == true
    files:
      - source: templates/Dockerfile.j2
        destination: Dockerfile
      - source: templates/.dockerignore
        destination: .dockerignore
      - source: templates/compose.yaml.j2
        destination: compose.yaml

# ---------------------------------------------------------------------------
# Verification contract — every generated project must satisfy these
# before `forge create` reports success. Checks run in order; the first
# failure short-circuits and surfaces the offending id.
#
# Unlike ``files[].source``, verification ``path`` and ``command`` *are*
# templated (they run in the generated project's context, not against the
# blueprint directory), so ``{{project_name | replace('-', '_')}}`` is
# used here for the Python-module contexts.
#
# Why `replace('-', '_')` and not bare `{{project_name}}`:
#   `forge create python.fastapi.api --name payments-api` produces a
#   package at `src/payments_api/`. A verification check that said
#   `python -c "import payments-api"` would fail on a *correctly generated*
#   project — because Python cannot import a module whose name contains a
#   hyphen. That failure mode would be attributed to the generated project
#   rather than the check, which is the opposite of the verification
#   phase's purpose. The filter makes the check describe what the project
#   actually is: a package at `payments_api`.
# ---------------------------------------------------------------------------
verification:
  # Cheap structural check first: fail fast if scaffolding dropped a file.
  - id: has_pyproject
    type: required_file
    path: pyproject.toml

  - id: has_package
    type: required_file
    path: src/{{project_name | replace('-', '_')}}/main.py

  # Behavioural check: the generated service must actually import and its
  # test suite must pass. Timeout is generous because cold caches on CI
  # can be slow the first time.
  - id: imports_cleanly
    type: command
    command: python -c "import {{project_name | replace('-', '_')}}"
    timeout: 120

  - id: tests_pass
    type: command
    command: pytest -q
    timeout: 300

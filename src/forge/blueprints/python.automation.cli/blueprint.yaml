# ---------------------------------------------------------------------------
# Forge official blueprint — python.automation.cli
#
# Scaffolds a small, production-shaped Python CLI automation tool:
#   * Typer-based entry point with a typed root command
#   * pydantic-settings config so env vars and flags share one source
#   * pytest + CliRunner test scaffolding
#   * optional shell-completion generation and a packaging hook
#
# Validated at load time against the canonical schema and the generated
# Pydantic models, so field-shape mistakes fail CI rather than users.
# ---------------------------------------------------------------------------
schema_version: "1.0.0"

id: python.automation.cli
name: Python CLI Automation Tool
version: 1.0.0
description: >-
  A small Typer-based automation CLI with typed settings, structured
  logging, and a test harness ready for CI. Intended as a starting point
  for internal tooling: batteries included, but nothing you would delete
  on day two.

category: cli
maintainer: "@platform-team"

compatibility:
  min_forge_version: 1.0.0

# ---------------------------------------------------------------------------
# Variables — ordered; the wizard presents them top to bottom.
# Every id is lower_snake_case (schema-enforced) and used verbatim in
# templates as `{{variable_id}}`.
#
# The variable `project_name` is supplied by the CLI itself (the `--name`
# argument, folded into the template context by `_resolve_inputs`), so it
# is *not* declared here. Declaring it would make the resolver try to
# resolve it against `--var`, which is not how the CLI supplies it, and
# the result would be a confusing prompt for a value the CLI already has.
#
# The variable `project_module` is the *Python identifier* derived from
# `project_name` (hyphens → underscores). Templates that need the package
# name — the module path in `pyproject.toml`, the import in `conftest.py`,
# the `__init__.py` docstring — use `{{project_name | replace('-', '_')}}`
# directly rather than declaring `project_module`. Same value, one place
# to change if the transform ever needs to be more elaborate.
# ---------------------------------------------------------------------------
variables:
  - id: command_name
    type: string
    description: >-
      The executable name installed by the generated package (the string
      users type after `pip install`). Lowercase, hyphen-safe.
    required: true
    default: automate
    validation:
      # Executable names must be filesystem- and shell-safe. We forbid
      # leading digits and hyphens-in-a-row because both break tab
      # completion on some shells and confuse argparse-style parsers.
      pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"

  - id: log_format
    type: enum
    description: Structured logging format emitted to stdout by default.
    required: true
    default: json
    validation:
      enum:
        - json
        - console
        - plain

  - id: include_completion
    type: boolean
    description: Generate shell-completion scripts and register them in the CLI entry point.
    required: false
    default: true

# ---------------------------------------------------------------------------
# Files — always applied.
#
# Contract (see docs/reference/PLANNING.md):
#   * `source:` is a *literal* filesystem path, resolved against the
#     blueprint directory. It is not templated. A template that will be
#     rendered must live at a static path with a `.j2` suffix; a template
#     that must be copied verbatim must live at a static path with no
#     suffix and must contain no `{{…}}`.
#   * `destination:` is templated, and may interpolate `{{project_name}}`
#     (supplied by the CLI) and any variable id declared above. Every
#     destination segment that ends up as a Python package name must be a
#     *Python identifier*, so `project_name` is transformed with the
#     `replace('-', '_')` filter wherever the destination is a module path.
#
# The templates directory uses a static `project/` subdirectory for
# package-internal files, not `{{project_name}}/`, because `source:` is not
# templated. The `.j2` suffix marks files that contain `{{…}}` and must be
# rendered; the absence of the suffix marks files that must be copied
# verbatim (and therefore must not contain `{{…}}`).
# ---------------------------------------------------------------------------
files:
  - source: templates/pyproject.toml.j2
    destination: pyproject.toml
  - source: templates/README.md.j2
    destination: README.md
  - source: templates/.gitignore
    destination: .gitignore
  - source: templates/src/project/__init__.py.j2
    destination: src/{{project_name | replace('-', '_')}}/__init__.py
  - source: templates/src/project/__main__.py.j2
    destination: src/{{project_name | replace('-', '_')}}/__main__.py
  - source: templates/src/project/cli.py.j2
    destination: src/{{project_name | replace('-', '_')}}/cli.py
  - source: templates/src/project/settings.py.j2
    destination: src/{{project_name | replace('-', '_')}}/settings.py
  - source: templates/src/project/logging.py.j2
    destination: src/{{project_name | replace('-', '_')}}/logging.py
  - source: templates/tests/test_cli.py.j2
    destination: tests/test_cli.py
  - source: templates/tests/conftest.py.j2
    destination: tests/conftest.py

# ---------------------------------------------------------------------------
# Conditional files — applied only when the expression evaluates true.
# Two independent branches here; the resolver evaluates each in order and
# merges the resulting file lists. Expressions stay intentionally simple
# (`<var_id> == <literal>`); anything richer belongs in a bespoke blueprint.
#
# The template paths follow the same discipline as `files[]`: `source:` is
# a literal path (a static `project/` subdirectory, not `{{project_name}}/`),
# and `destination:` is templated with the `replace('-', '_')` filter
# wherever it names a Python module.
# ---------------------------------------------------------------------------
conditional_files:
  # Shell completion is opt-in because it edits the user's shell rc files
  # and generates a real artefact (`completions/`). Off by default for
  # users who want a bare CLI.
  - condition: include_completion == true
    files:
      - source: templates/src/project/completion.py.j2
        destination: src/{{project_name | replace('-', '_')}}/completion.py
      - source: templates/completions/{{command_name}}.bash.j2
        destination: completions/{{command_name}}.bash

  # Console/plain log formats need a formatter module that the JSON path
  # does not. Keeping it conditional avoids shipping unused code — a small
  # but real technical-debt win.
  #
  # Both branches produce the same destination; the planner's collision
  # detector sees them as separate *conditional* entries and only the
  # branch whose condition is true will be included. The two branches
  # never fire simultaneously because `log_format` is a single-valued
  # enum — the condition evaluator evaluates each entry against the same
  # `log_format` value, so `log_format == console` and `log_format == plain`
  # cannot both be true.
  - condition: log_format == console
    files:
      - source: templates/src/project/_formatters.py.j2
        destination: src/{{project_name | replace('-', '_')}}/_formatters.py

  - condition: log_format == plain
    files:
      - source: templates/src/project/_formatters.py.j2
        destination: src/{{project_name | replace('-', '_')}}/_formatters.py

# ---------------------------------------------------------------------------
# Verification contract — every generated project must satisfy these
# before `forge create` reports success. Structural checks first (cheap,
# fail fast); behavioural checks afterwards (real import + real help text).
#
# `path:` and `command:` *are* templated (they run in the generated
# project's context, not against the blueprint directory), so
# `{{project_name}}` is used here — with the same `replace('-', '_')`
# transform for the package-import contexts.
# ---------------------------------------------------------------------------
verification:
  - id: has_pyproject
    type: required_file
    path: pyproject.toml

  - id: has_entrypoint
    type: required_file
    path: src/{{project_name | replace('-', '_')}}/cli.py

  # Import proves the package installs cleanly and its dependencies are
  # declared. This catches the most common scaffolding regression:
  # a template that references a package missing from pyproject.
  #
  # The `replace('-', '_')` filter is what makes `--name payments-cli`
  # produce `python -c "import payments_cli"` rather than the (invalid)
  # `import payments-cli`. Without it, a project created with a hyphenated
  # name would fail this check *on a correctly generated project* — a
  # category of bug the verification phase exists to prevent.
  - id: imports_cleanly
    type: command
    command: python -c "import {{project_name | replace('-', '_')}}"
    timeout: 120

  # `--help` proves the Typer app is wired to the console_scripts entry
  # point. It is the cheapest behavioural test that a CLI actually *is*
  # a CLI, and it runs in under a second on a cold cache.
  - id: help_responds
    type: command
    command: "python -m {{project_name | replace('-', '_')}} --help"
    timeout: 60

  - id: tests_pass
    type: command
    command: pytest -q
    timeout: 300

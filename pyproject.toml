# =============================================================================
# Forge CLI — Project Configuration
# =============================================================================
# This file is the single source of truth for:
#   - Project metadata and dependencies (PEP 621)
#   - Build backend (Hatchling + hatch-vcs)
#   - Linting, formatting (Ruff)
#   - Type checking (mypy, strict mode)
#   - Testing, coverage (pytest, coverage.py)
#
# Design principles:
#   1. Single source of truth  — one file for all tooling
#   2. Explicit bounds         — no surprise major-version breakage
#   3. Strict by default       — fail early, fail loud
#   4. Reproducible            — uv.lock + hatch-vcs from Git tags
#   5. Secure                  — Bandit, T20, PT rules enforce safe code
# =============================================================================

[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

# -----------------------------------------------------------------------------
# Project Metadata
# -----------------------------------------------------------------------------
[project]
name = "forge-cli"
dynamic = ["version"]                       # Derived from Git tag via hatch-vcs
description = "The engineering foundation system for software projects."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Forge CLI Contributors" }]
maintainers = [{ name = "Thapelo Magqazana" }]
keywords = [
    "scaffolding",
    "developer-tools",
    "cli",
    "blueprints",
    "engineering",
    "project-generation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Code Generators",
]

# Runtime dependencies: intentionally minimal and bounded.
# Every dependency is a liability. We choose a small, well-maintained set.
dependencies = [
    "typer>=0.12.0,<1.0",
    "rich>=13.7.0,<14.0",
    "pydantic>=2.6.0,<3.0",
    "pydantic-settings>=2.2.0,<3.0",
    "jinja2>=3.1.3,<4.0",
    "pyyaml>=6.0.1,<7.0",
    "jsonschema>=4.21.0,<5.0",
    "httpx>=0.27.0,<1.0",
]

# Development dependencies: installed with `uv sync --all-extras`.
[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-xdist>=3.5,<4.0",
    "hypothesis>=6.100,<7.0",
    "ruff>=0.4.0,<1.0",
    "mypy>=1.10,<2.0",
    "bandit>=1.7.8,<2.0",
    "pip-audit>=2.7.0,<3.0",
    "pre-commit>=3.7,<4.0",
]

# Console entry point — `forge` becomes a real executable.
[project.scripts]
forge = "forge.cli.app:main"

[project.urls]
Homepage = "https://github.com/thapelomagqazana/forge-cli"
Documentation = "https://github.com/thapelomagqazana/forge-cli/tree/main/docs"
Repository = "https://github.com/thapelomagqazana/forge-cli"
Issues = "https://github.com/thapelomagqazana/forge-cli/issues"
Changelog = "https://github.com/thapelomagqazana/forge-cli/blob/main/CHANGELOG.md"

# -----------------------------------------------------------------------------
# Version Resolution (hatch-vcs)
# -----------------------------------------------------------------------------
# The version comes from the Git tag. No manual bumps, no drift.
# `forge --version` always matches the released tag.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/forge/_version.py"

# -----------------------------------------------------------------------------
# Wheel Packaging
# -----------------------------------------------------------------------------
# Bundles schemas and blueprints *inside* the wheel so that `forge` works
# offline immediately after `pip install`. Non-negotiable for local-first.
[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.hatch.build.targets.wheel.force-include]
"src/forge/schemas" = "forge/schemas"
"src/forge/blueprints" = "forge/blueprints"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

# -----------------------------------------------------------------------------
# Ruff — Linting and Formatting
# -----------------------------------------------------------------------------
# Replaces Flake8, isort, pyupgrade, Black, and Bandit-for-Python.
# Runs in <1s on this codebase.
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
    "src/forge/blueprints",
    "src/forge/_version.py",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade (modernize syntax)
    "B",    # flake8-bugbear (common bugs)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print (no stray prints)
    "PT",   # flake8-pytest-style
]
ignore = [
    "E501",   # Line length is enforced by the formatter
    "B008",   # Typer's Option()/Argument() default pattern is intentional
]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert (S101) and print (T20) for debugging.
"tests/**/*.py" = ["S101", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["forge"]
known-third-party = ["typer", "rich", "pydantic", "jinja2", "yaml", "jsonschema", "httpx"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# -----------------------------------------------------------------------------
# mypy — Static Type Checking (Strict)
# -----------------------------------------------------------------------------
# Strict mode is non-negotiable. Every function has typed parameters and a
# return type. This is our 3 AM insurance policy.
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_any_unimported = true
no_implicit_optional = true
no_implicit_reexport = true
show_error_codes = true
show_error_context = true
pretty = true
files = ["src"]
exclude = ["src/forge/blueprints", "src/forge/_version.py"]

[[tool.mypy.overrides]]
# Third-party libraries without type stubs.
module = ["yaml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests use pytest fixtures which are dynamically typed.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# -----------------------------------------------------------------------------
# pytest — Testing and Coverage
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "--cov=src/forge",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=90",
]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "contract: Contract tests",
    "e2e: End-to-end tests",
    "security: Security tests",
    "slow: Slow tests (deselect with -m \"not slow\")",
]
filterwarnings = [
    "error",                              # Warnings become errors in CI
    "ignore::DeprecationWarning:typer",   # Typer has known deprecations
]

# -----------------------------------------------------------------------------
# Coverage
# -----------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/forge"]
branch = true
omit = [
    "*/__init__.py",
    "*/_version.py",
    "src/forge/blueprints/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@abstractmethod",
    "class .*\\bProtocol\\):",
]

[tool.coverage.xml]
output = "coverage.xml"
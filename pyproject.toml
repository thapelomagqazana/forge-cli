# =============================================================================
# Forge CLI — Project Configuration
# =============================================================================
# This file is the single source of truth for:
#   - Project metadata and dependencies (PEP 621)
#   - Build backend (Hatchling + hatch-vcs)
#   - Linting, formatting (Ruff)
#   - Type checking (mypy, strict mode)
#   - Testing, coverage (pytest, coverage.py)
#
# Design principles:
#   1. Single source of truth  — one file for all tooling
#   2. Explicit bounds         — no surprise major-version breakage
#   3. Strict by default       — fail early, fail loud
#   4. Reproducible            — uv.lock + hatch-vcs from Git tags
#   5. Secure                  — Bandit, T20, PT rules enforce safe code
# =============================================================================

[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

# -----------------------------------------------------------------------------
# Project Metadata
# -----------------------------------------------------------------------------
[project]
name = "forge-cli"
dynamic = ["version"]                       # Derived from Git tag via hatch-vcs
description = "The engineering foundation system for software projects."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Forge CLI Contributors" }]
maintainers = [{ name = "Thapelo Magqazana" }]
keywords = [
    "scaffolding",
    "developer-tools",
    "cli",
    "blueprints",
    "engineering",
    "project-generation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Code Generators",
]

# Runtime dependencies: intentionally minimal and bounded.
# Every dependency is a liability. We choose a small, well-maintained set.
#
# The list is alphabetised for two reasons:
#   1. It is scannable — a reviewer looking for "is X a dependency?"
#      knows where to look without reading every line.
#   2. Merge-conflict resolution becomes mechanical. ``uv.lock``
#      encodes dependency order; any reordering of this list produces
#      a spurious lockfile diff, and mechanical resolution prevents
#      "I resolved the conflict by reordering, and now everything is
#      broken" incidents.
dependencies = [
    "click>=8.1.0,<9.0",
    "httpx>=0.27.0,<1.0",
    "jinja2>=3.1.3,<4.0",
    # ``jsonschema`` 4.22+ is the minimum that ships a stable, public
    # ``Draft202012Validator`` with the ``iter_errors`` API our
    # verification funnel relies on, and that resolves the Draft
    # 2020-12 meta-schema without extra deps. Pinning the floor
    # tighter than 4.21 prevents silent regressions on older hosts.
    "jsonschema>=4.22.0,<5.0",
    # ``pydantic`` 2.7+ is the minimum that ships the strict-mode
    # ``ConfigDict(extra="forbid", strict=True)`` behaviour our
    # generated models depend on, and that preserves the ``loc`` tuple
    # shapes ``_format_pydantic_errors`` relies on for JSON-Pointer
    # translation. The floor matches the version the codegen tool
    # targets when it emits ``pydantic_v2.BaseModel`` output.
    "pydantic>=2.7.0,<3.0",
    "pydantic-settings>=2.2.0,<3.0",
    "pyyaml>=6.0.1,<7.0",
    # ``questionary`` powers the interactive wizard. Its public API is
    # stable; the ``unsafe_ask`` entry point used by
    # ``forge.cli.prompts`` raises ``KeyboardInterrupt`` and
    # ``EOFError`` on cancellation, which the prompt engine converts
    # into ``PromptCancelledError`` — no other library behaviour is
    # depended on.
    "questionary>=2.0.1,<3.0",
    "rich>=13.7.0,<14.0",
    "typer>=0.12.0,<1.0",
    # ``importlib-resources`` is stdlib on 3.9+, so no conditional
    # dependency is required. ``jsonschema``, ``pydantic``, and
    # ``questionary`` are the only additions relative to the previous
    # version.
]

# Development dependencies: installed with `uv sync --all-extras`.
[project.optional-dependencies]
dev = [
    "bandit>=1.7.8,<2.0",
    # ``datamodel-code-generator`` produces ``forge.models.blueprint``
    # from the canonical JSON Schema (ADR-0008). It is a *dev* dep —
    # the generated file is committed, so the runtime wheel does not
    # need the tool. The floor is the oldest version whose CLI flags
    # match ``_GENERATOR_ARGS`` in ``forge.models._generator``; if a
    # future release changes flag names, that module is the only file
    # to update.
    "datamodel-code-generator>=0.25.0,<0.26",
    "hypothesis>=6.100,<7.0",
    "mypy>=1.10,<2.0",
    "pip-audit>=2.7.0,<3.0",
    "pre-commit>=3.7,<4.0",
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-xdist>=3.5,<4.0",
    "ruff==0.4.4",
    # Stubs for libraries that ship without annotations. Keeping them
    # as *dev* dependencies (not runtime) means the wheel stays lean
    # while developers get full type coverage locally and in CI.
    "types-jsonschema>=4.22.0",
    "types-PyYAML>=6.0.12",
]

# Console entry point — `forge` becomes a real executable.
[project.scripts]
forge = "forge.cli.main:main"

[project.urls]
Homepage = "https://github.com/thapelomagqazana/forge-cli"
Documentation = "https://github.com/thapelomagqazana/forge-cli/tree/main/docs"
Repository = "https://github.com/thapelomagqazana/forge-cli"
Issues = "https://github.com/thapelomagqazana/forge-cli/issues"
Changelog = "https://github.com/thapelomagqazana/forge-cli/blob/main/CHANGELOG.md"

# -----------------------------------------------------------------------------
# Version Resolution (hatch-vcs)
# -----------------------------------------------------------------------------
# The version comes from the Git tag. No manual bumps, no drift.
# `forge --version` always matches the released tag.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/forge/_version.py"

# -----------------------------------------------------------------------------
# Wheel Packaging
# -----------------------------------------------------------------------------
# Bundles schemas and blueprints *inside* the wheel so that `forge` works
# offline immediately after `pip install`. Non-negotiable for local-first.
[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

# Ship the canonical JSON Schema as a package resource (ADR-0007).
# Hatchling's ``packages`` directive ships ``*.py`` files by default;
# non-Python package-internal files must be declared explicitly, or they
# will be absent from the installed wheel, causing
# ``importlib.resources.files("forge.schemas")`` to raise
# ``FileNotFoundError`` at runtime — even though the same code works
# from an editable install (where the file is read directly from the
# source tree). That divergence is the classic "works on my machine,
# breaks for users" packaging bug, and it would be fatal here because
# the schema is the canonical contract (ADR-0007): the shipped wheel
# must contain it, or the CLI cannot validate any blueprint.
#
# ``artifacts`` ships files verbatim regardless of Hatchling's language
# heuristics. The glob (rather than a single filename) anticipates a
# future v2 schema shipped alongside v1 during migration: adding a
# schema becomes a data change, not a config change.
#
# Do *not* replace this with ``shared-data``: that directive places
# files under the wheel's ``share/`` tree, which is *outside* the
# importable package and unreachable via ``importlib.resources``. An
# earlier revision of this file used ``shared-data`` and silently
# shipped a duplicate copy of the schema that no code path could read.
artifacts = ["src/forge/schemas/*.json"]

# ``force-include`` is reserved for assets that live *outside* the
# package directory and must appear *inside* it in the installed wheel.
[tool.hatch.build.targets.wheel.force-include]
"src/forge/py.typed" = "forge/py.typed"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

# -----------------------------------------------------------------------------
# Ruff — Linting and Formatting
# -----------------------------------------------------------------------------
# Replaces Flake8, isort, pyupgrade, Black, and Bandit-for-Python.
# Runs in <1s on this codebase.
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
    "src/forge/blueprints",
    # Generated by ``scripts/generate_models.py`` (ADR-0008). Linting a
    # file whose content is derived from the schema is a losing battle:
    # any fix would be undone on the next ``make models``, and any rule
    # the generator's output violates would become a permanent ignore
    # in this file. The generated file is instead *reviewed* as a
    # projection of the schema, and its invariants are enforced by the
    # parity test — a stronger guarantee than ruff could provide.
    "src/forge/models/blueprint.py",
    "src/forge/_version.py",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade (modernize syntax)
    "B",    # flake8-bugbear (common bugs)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print (no stray prints)
    "PT",   # flake8-pytest-style
]
ignore = [
    "E501",   # Line length is enforced by the formatter
    "B008",   # Typer's Option()/Argument() default pattern is intentional
]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert (S101) and print (T20) for debugging.
"tests/**/*.py" = ["S101", "T20"]

# The drift test invokes ``scripts/generate_models.py`` as a subprocess
# with arguments that are all compile-time literals (``sys.executable``,
# the module-level ``_GENERATOR_SCRIPT`` constant, and the literal
# ``"--check"``). Bandit's S603 fires because the argument *list* is
# computed, not because any element is untrusted — the same false
# positive as every other safe ``subprocess.run([...])`` call.
#
# The suppression lives here rather than as an inline ``# ruff: noqa``
# in the test file because inline directives at line 1 of a file that
# begins with a docstring are silently stripped by Ruff's ``RUF100``
# cleanup (an unused-``noqa`` rule that runs under ``--fix``) on the
# next ``make fix``. A per-file ignore has no such interaction with
# other rules and does not participate in the noqa-cleanup pass.
"tests/unit/models/test_generated_in_sync.py" = ["S603"]

# Scripts are standalone CLI tools, not library code. They are:
#   - Not imported by any other module.
#   - Not shipped in the wheel.
#   - Not tested by pytest (invoked from the shell).
# They legitimately need to write to stdout, and explicit if/else is
# often clearer than a ternary. Relax only the rules that conflict
# with the script role.
"scripts/**/*.py" = ["T201", "SIM108"]

# ``forge.models._generator`` is a developer tool, not library code.
# It legitimately prints to stdout/stderr (its whole job is to
# communicate regeneration results to a human running ``make models``),
# and it shells out to ``datamodel-code-generator`` for the reasons
# documented in that module. Relaxing only the rules that conflict
# with the tool's role keeps the rest of the package under the strict
# ruleset.
"src/forge/models/_generator.py" = ["T201", "S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["forge"]
known-third-party = [
    "typer",
    "rich",
    "pydantic",
    "pydantic_settings",
    "jinja2",
    "yaml",
    "jsonschema",
    "httpx",
    "questionary",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# -----------------------------------------------------------------------------
# mypy — Static Type Checking (Strict)
# -----------------------------------------------------------------------------
# Strict mode is non-negotiable. Every function has typed parameters and a
# return type. This is our 3 AM insurance policy.
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_any_unimported = true
no_implicit_optional = true
no_implicit_reexport = true
show_error_codes = true
show_error_context = true
pretty = true
files = ["src"]
exclude = [
    "src/forge/blueprints",
    # Generated — see the corresponding Ruff exclusion. The file's
    # types are derived from the schema; mypy errors against it would
    # be addressed by regenerating with different flags (a decision in
    # ``_GENERATOR_ARGS``), not by editing the generated output. The
    # ``_model_class`` indirection in the verification funnel means
    # callers still see fully typed models — only the *definition*
    # site is exempt, not its use.
    "src/forge/models/blueprint.py",
    "src/forge/_version.py",
]

[[tool.mypy.overrides]]
# ``forge._version`` is generated by hatch-vcs at build time. It has
# no type annotations (the generator does not emit them), and it is
# listed in .gitignore. Treat it as untyped so mypy does not report
# an `import-untyped` error for `from forge._version import __version__`.
# The override is narrow: only this one generated module is exempted.
module = ["forge._version"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ``questionary`` ships no stubs on PyPI and no third-party stubs
# package exists. The library's public API is stable enough that the
# return types are declared at the call site in ``forge.cli.prompts``
# with ``cast`` — the missing stubs do not weaken the rest of the
# codebase, only the boundary where ``prompts.py`` calls into
# ``questionary`` needs an explicit cast. ``yaml`` is covered by
# ``types-PyYAML``; the override is belt-and-braces so a developer
# running mypy outside the dev extras still passes.
#
# ``datamodel_code_generator`` is only imported by
# ``scripts/generate_models.py`` (not under ``files = ["src"]``), so
# no override is needed — mypy never sees it.
module = ["yaml.*", "questionary.*"]
ignore_missing_imports = true

# -----------------------------------------------------------------------------
# pytest — Testing and Coverage
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "--cov=src/forge",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=90",
]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "contract: Contract tests",
    "e2e: End-to-end tests",
    "security: Security tests",
    "slow: Slow tests (deselect with -m \"not slow\")",
]
filterwarnings = [
    "error",                              # Warnings become errors in CI
    "ignore::DeprecationWarning:typer",   # Typer has known deprecations
]

# -----------------------------------------------------------------------------
# Coverage
# -----------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/forge"]
branch = true
omit = [
    "*/__init__.py",
    "*/_version.py",
    "src/forge/blueprints/*",

    # ``forge.models.blueprint`` is generated (ADR-0008) and its
    # *content* is fully exercised by the parity tests through
    # ``validate_blueprint_document``. Counting its lines would inflate
    # coverage without measuring behaviour — every branch in the
    # generated file is either pydantic internals or hand-tuned code
    # whose behaviour is asserted by ``test_schema_model_parity`` and
    # ``test_model_error_messages``. The *handlers* that call into the
    # model, and the facade that exposes it, remain covered.
    "src/forge/models/blueprint.py",

    # ``forge.models._generator`` is a developer tool invoked by
    # ``make models`` and CI, not by ``forge``. Its behaviour is
    # exercised by ``test_generated_in_sync`` (which calls
    # ``main(["--check"])``) and by the regeneration step itself in
    # CI, but neither path runs under pytest's coverage hooks — the
    # test invokes ``main`` in-process, and the CI path runs
    # ``python -m forge.models._generator`` as a subprocess. Omitting
    # it here is honest: the behaviour is tested, coverage just
    # cannot observe both invocations uniformly.
    "src/forge/models/_generator.py",

    # `__main__.py` is a three-line entry point whose only job is to
    # call `main()`. Its behaviour is tested by the
    # `test_python_m_entry_point` integration test, which runs the
    # CLI via `subprocess`. Coverage cannot see subprocess-invoked
    # code, so omitting `__main__.py` from the report is honest: the
    # behaviour is tested, the coverage tool just cannot observe it.
    "src/forge/cli/__main__.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@abstractmethod",
    "class .*\\bProtocol\\):",
]

[tool.coverage.xml]
output = "coverage.xml"
